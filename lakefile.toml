name = "test"
version = "0.1.0"
defaultTargets = ["test"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.28.0"

[[lean_lib]]
name = "test"


# Restart File demo: two single-module libs so `RestartShow` can import
# `RestartDef` without colliding with the dependency-owned `test.*`
# namespace (proofwidgets also declares a `test` lib).
[[lean_lib]]
name = "RestartDef"

[[lean_lib]]
name = "RestartShow"
